name: Scrape LWN

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lwn-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare cookies from secret
        env:
          LWN_COOKIES: ${{ secrets.LWN_COOKIES }}
        run: |
          if [ -z "${LWN_COOKIES:-}" ]; then
            echo "Missing GitHub secret LWN_COOKIES (Netscape cookies.txt content)." >&2
            echo "Set it with: gh secret set LWN_COOKIES < /path/to/cookies.txt" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$LWN_COOKIES" > cookies.txt

      - name: Run scraper (safe batch)
        run: |
          python3 scrape_lwn.py \
            --cookies cookies.txt \
            --out . \
            --max-pages 10 \
            --delay 5 \
            --jitter 3 \
            --timeout 30 \
            --max-retries 5

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Archive update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
